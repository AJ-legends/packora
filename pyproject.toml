[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packora"
version = "1.0.0"
description = "Packora - educational terminal packet analyzer (mini-Wireshark for the terminal)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alamu" }]
keywords = ["packets", "sniffer", "scapy", "networking", "security", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "scapy>=2.5,<3",
  "textual>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
packora = "packora.cli:main"

[tool.setuptools.packages.find]
include = ["packora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
# The UI layer is smoke-tested only (PRD N6); coverage gate applies to logic layers.
omit = ["packora/ui/*", "packora/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packora", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["samples"]
